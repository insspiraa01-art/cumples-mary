<!DOCTYPE html>
<html lang="es">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitación Mary</title>

<style>

*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    padding:0;
    width:100%;
}

body{
    display:flex;
    justify-content:center;
    background:#63c7c9;
    font-family:Arial, sans-serif;
}

.container{
    position:relative;
    width:100%;
    max-width:600px;
    margin:0 auto;
}

.container img{
    width:100%;
    height:auto;
    display:block;
}


/* =========================================
   CONTADOR
   ========================================= */

.contador{
    position:absolute;

    top:39.35%;
    left:10%;
    width:80%;
    height:4%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:30px;
    font-weight:bold;

    color:white;

    background:rgba(0,170,180,0.90);

    padding:8px;

    border-radius:12px;

    letter-spacing:1px;

    z-index:10;
}

.tiempo{
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.numero{
    font-size:27px;
    line-height:1;
}

.label{
    font-size:10px;
    margin-top:4px;
}


/* =========================================
   CONTROLES DE MUSICA
   ========================================= */

.music-controls{
    position:absolute;

    top:33.1%;
    left:4%;
    width:48%;

    display:flex;
    justify-content:center;
    gap:8px;

    z-index:20;
}

.music-controls button{

    background:rgba(0,0,0,0.20);

    border:none;

    border-radius:8px;

    padding:6px 9px;

    color:white;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    text-shadow:0 2px 5px rgba(0,0,0,0.7);

}

.music-controls button:hover{
    background:rgba(0,0,0,0.35);
}


/* =========================================
   MAPA
   ========================================= */

.mapa{
    position:absolute;

    top:48.55%;
    left:49.2%;

    width:46.5%;
    height:6.5%;

    z-index:30;

    display:block;
}


/* =========================================
   CONFIRMAR ASISTENCIA
   ========================================= */

.confirmar{
    position:absolute;

    top:93.8%;
    left:23.5%;

    width:54.5%;
    height:5.8%;

    z-index:30;

    display:block;
}


/* =========================================
   RESPONSIVE
   ========================================= */

@media (max-width:600px){

    .contador{
        top:39.35%;
        left:10%;
        width:80%;
        height:4%;
        font-size:25px;
    }

    .numero{
        font-size:23px;
    }

    .label{
        font-size:9px;
    }

    .music-controls{
        top:33.1%;
        left:4%;
        width:48%;
        gap:5px;
    }

    .music-controls button{
        font-size:12px;
        padding:5px 7px;
    }

    .mapa{
        top:48.55%;
        left:49.2%;
        width:46.5%;
        height:6.5%;
    }

    .confirmar{
        top:93.8%;
        left:23.5%;
        width:54.5%;
        height:5.8%;
    }

}


/* =========================================
   CELULARES PEQUEÑOS
   ========================================= */

@media (max-width:400px){

    .contador{
        font-size:22px;
        padding:6px;
    }

    .numero{
        font-size:20px;
    }

    .label{
        font-size:8px;
    }

    .music-controls button{
        font-size:11px;
        padding:4px 6px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     MUSICA
     ========================================= -->

<audio id="audioFiesta" loop>

    <source src="rock.mp3" type="audio/mpeg">

</audio>


<div class="container">


<!-- =========================================
     TARJETA
     ========================================= -->

<img
    src="cumples-mary.png"
    alt="Invitación de cumpleaños de Mary"
>


<!-- =========================================
     CONTROLES MUSICA
     ========================================= -->

<div class="music-controls">

    <button onclick="playMusic()">
        ▶ Reproducir
    </button>

    <button onclick="pauseMusic()">
        ⏸ Pausar
    </button>

</div>


<!-- =========================================
     CONTADOR
     ========================================= -->

<div class="contador">

    <div class="tiempo">

        <div>

            <div class="numero" id="dias">
                0
            </div>

            <div class="label">
                DÍAS
            </div>

        </div>


        <div>

            <div class="numero" id="horas">
                0
            </div>

            <div class="label">
                HORAS
            </div>

        </div>


        <div>

            <div class="numero" id="minutos">
                0
            </div>

            <div class="label">
                MIN
            </div>

        </div>


        <div>

            <div class="numero" id="segundos">
                0
            </div>

            <div class="label">
                SEG
            </div>

        </div>

    </div>

</div>


<!-- =========================================
     MAPA
     ========================================= -->

<a
    class="mapa"
    href="https://maps.app.goo.gl/2mbsCxbHHR8FXzWd8"
    target="_blank"
    aria-label="Abrir ubicación en Google Maps">
</a>


<!-- =========================================
     CONFIRMAR ASISTENCIA
     ========================================= -->

<a
    class="confirmar"
    href="https://wa.me/3115929384?text=Hola,%20confirmo%20mi%20asistencia%20al%20cumplea%C3%B1os%20de%20Mary"
    target="_blank"
    aria-label="Confirmar asistencia">
</a>


</div>


<script>


/* =========================================
   MUSICA
   ========================================= */

const audio =
    document.getElementById("audioFiesta");


function playMusic(){

    audio.play();

}


function pauseMusic(){

    audio.pause();

}


/* =========================================
   CONTADOR
   ========================================= */

const fechaEvento =
    new Date("Sep 12, 2026 23:59:59").getTime();


function actualizarContador(){

    const ahora =
        new Date().getTime();


    const diferencia =
        fechaEvento - ahora;


    if(diferencia <= 0){

        document.getElementById("dias").innerHTML = "0";

        document.getElementById("horas").innerHTML = "0";

        document.getElementById("minutos").innerHTML = "0";

        document.getElementById("segundos").innerHTML = "0";

        return;

    }


    const dias =
        Math.floor(
            diferencia /
            (1000 * 60 * 60 * 24)
        );


    const horas =
        Math.floor(
            (diferencia %
            (1000 * 60 * 60 * 24))
            /
            (1000 * 60 * 60)
        );


    const minutos =
        Math.floor(
            (diferencia %
            (1000 * 60 * 60))
            /
            (1000 * 60)
        );


    const segundos =
        Math.floor(
            (diferencia %
            (1000 * 60))
            /
            1000
        );


    document.getElementById("dias").innerHTML =
        dias;


    document.getElementById("horas").innerHTML =
        horas;


    document.getElementById("minutos").innerHTML =
        minutos;


    document.getElementById("segundos").innerHTML =
        segundos;

}


/* Actualizar inmediatamente */

actualizarContador();


/* Actualizar cada segundo */

setInterval(
    actualizarContador,
    1000
);


</script>


</body>

</html>
