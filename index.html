<!DOCTYPE html>
<html lang="es">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitación Mary</title>

<style>

body{
margin:0;

.music-controls{

<body>

<audio id="audioFiesta" loop>
<source src="rock.mp3" type="audio/mpeg">
</audio>

<div class="container">

<img src="Feliz dia Nona.png" alt="Invitación cumpleaños Mary">

<!-- CONTROLES MUSICA -->

<div class="music-controls">

<button onclick="playMusic()">▶ Reproducir</button>

<button onclick="pauseMusic()">⏸ Pausar</button>

</div>

<!-- CONTADOR -->

<div class="contador">

<div class="tiempo">

<div class="numero" id="dias"></div>

</div>

<script>

/* MUSICA */

const audio = document.getElementById("audioFiesta");

function playMusic(){

audio.play();

}

function pauseMusic(){

audio.pause();

}


/* CONTADOR */

/* Cumpleaños de Mary: 12 de septiembre de 2026 */

var fechaEvento = new Date("Sep 12, 2026 00:00:00").getTime();

setInterval(function(){

var ahora = new Date().getTime();

var diferencia = fechaEvento - ahora;

var dias = Math.floor(
diferencia / (1000*60*60*24)
);

var horas = Math.floor(
(diferencia % (1000*60*60*24)) / (1000*60*60)
);

var minutos = Math.floor(
(diferencia % (1000*60*60)) / (1000*60)
);

var segundos = Math.floor(
(diferencia % (1000*60)) / 1000
);


/* Mostrar contador */

document.getElementById("dias").innerHTML = dias;

document.getElementById("horas").innerHTML = horas;

document.getElementById("minutos").innerHTML = minutos;

document.getElementById("segundos").innerHTML = segundos;

},1000);

</script>

</body>
